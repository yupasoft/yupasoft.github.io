<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portal Yupasoft</title>
<meta name="description" content="Portal de clientes de Yupasoft: entra a tus herramientas.">
<meta name="theme-color" content="#0C1A2E">
<script>try{if(localStorage.getItem("yp_tema")==="claro"){document.documentElement.setAttribute("data-tema","claro");document.querySelector('meta[name=theme-color]').content="#F4F7FA"}}catch(e){}</script>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --tinta:#0C1A2E; --tinta-2:#0A1526; --panel:#142540; --panel-2:#1A2F4E; --borde:#243B58;
  --turq:#2ED3B7; --turq-soft:#5CE0C4; --turq-osc:#159C86; --ambar:#F2A93B; --rojo:#EF5350;
  --gris:#9BB0C9; --gris-osc:#6B8099; --claro:#F4F7FA; --texto:#E8EEF6;
  --display:'Sora',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
  --radio:16px;
  --bg:#0C1A2E; --fuerte:#fff; --linea:rgba(255,255,255,.07); --hover:rgba(255,255,255,.05);
  --vidrio:rgba(12,26,46,.82); --vidrio-2:rgba(20,37,64,.72); --sombra:var(--sombra); --velo:rgba(5,10,20,.62); --sutil:rgba(0,0,0,.14);
  --turq-t:#2ED3B7; --ambar-t:#F2A93B; --rojo-t:var(--rojo-t);
  color-scheme:dark;
}
/* ---------- tema claro (el oscuro es el de siempre) ---------- */
:root[data-tema="claro"]{
  --bg:#F4F7FA; --tinta-2:#FFFFFF; --panel:#FFFFFF; --panel-2:#EEF3F8; --borde:#D5DFEA;
  --gris:#5A7086; --gris-osc:#7B8EA3; --texto:#0C1A2E; --fuerte:#0C1A2E;
  --linea:rgba(12,26,46,.09); --hover:rgba(12,26,46,.05);
  --vidrio:rgba(255,255,255,.86); --vidrio-2:rgba(255,255,255,.88); --sombra:rgba(20,40,70,.16); --velo:rgba(12,26,46,.38); --sutil:rgba(12,26,46,.045);
  --turq-t:#0B7F6D; --ambar-t:#A86A00; --rojo-t:#B3261E; --turq-osc:#0B7F6D;
  color-scheme:light;
}
:root[data-tema="claro"] .fondo{background:radial-gradient(1100px 600px at 80% -10%,rgba(46,211,183,.20),transparent 60%),radial-gradient(900px 600px at -10% 110%,rgba(242,169,59,.14),transparent 60%),var(--bg)}
:root[data-tema="claro"] .logo svg [stroke="#FFFFFF"],:root[data-tema="claro"] .marca svg [stroke="#FFFFFF"]{stroke:#0C1A2E}
:root[data-tema="claro"] .h-card:hover{box-shadow:0 24px 50px var(--sombra),0 0 50px -14px color-mix(in srgb,var(--c) 55%,transparent)}
:root[data-tema="claro"] .chip.ok{background:rgba(11,127,109,.10);border-color:rgba(11,127,109,.4)}
:root[data-tema="claro"] .chip.aviso{background:rgba(168,106,0,.10);border-color:rgba(168,106,0,.4)}
:root[data-tema="claro"] .chip.mal{background:rgba(179,38,30,.08);border-color:rgba(179,38,30,.4)}
.nomh{color:color-mix(in srgb,var(--c) 70%,var(--fuerte))}
.tema-flot{position:fixed;top:calc(14px + env(safe-area-inset-top));right:14px;z-index:5}
.btn.tema svg,[data-a="tema"] svg{width:18px;height:18px;display:block}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--display);background:var(--bg);color:var(--texto);-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--turq-t);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:3px solid var(--turq);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
.mono{font-family:var(--mono)}

/* ---------- fondo: la yupana que se enciende ---------- */
.fondo{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;
  background:radial-gradient(1100px 600px at 80% -10%,rgba(46,211,183,.16),transparent 60%),
             radial-gradient(900px 600px at -10% 110%,rgba(242,169,59,.10),transparent 60%),var(--bg)}
.fondo .rej{position:absolute;right:-60px;bottom:-60px;display:grid;grid-template-columns:repeat(4,1fr);gap:22px;width:min(560px,80vw);opacity:.55;transform:rotate(-8deg)}
.fondo .rej i{aspect-ratio:1;border-radius:22%;border:2px solid var(--linea)}
.fondo .rej i.on{background:rgba(46,211,183,.16);border-color:rgba(46,211,183,.35);animation:enciende 5.6s ease-in-out infinite both}
.fondo .rej i.top{background:rgba(242,169,59,.22);border-color:rgba(242,169,59,.5)}
@keyframes enciende{0%,100%{opacity:.35}12%,70%{opacity:1}}
@media (prefers-reduced-motion:reduce){.fondo .rej i.on{animation:none}}

/* ---------- ingreso ---------- */
#vLogin{position:relative;z-index:1;min-height:100dvh;display:grid;place-items:center;padding:24px 16px}
.login{width:min(440px,100%);display:flex;flex-direction:column;align-items:center;gap:26px}
.login .marca svg{width:min(300px,72vw);height:auto;display:block}
.tarjeta-login{width:100%;background:var(--vidrio-2);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid var(--linea);border-radius:22px;padding:28px 26px 24px;box-shadow:0 30px 80px var(--sombra)}
.tarjeta-login h1{font-size:22px;font-weight:800;letter-spacing:-.01em}
.tarjeta-login .sub{color:var(--gris);font-size:14px;margin:6px 0 20px}
label.campo{display:block;font-size:12px;font-family:var(--mono);letter-spacing:.08em;color:var(--gris);margin-bottom:14px;text-transform:uppercase}
label.campo input,label.campo select,label.campo textarea{display:block;width:100%;margin-top:7px;padding:13px 14px;border-radius:12px;
  background:var(--tinta-2);border:1px solid var(--borde);font-size:16px;color:var(--fuerte);font-family:var(--display);text-transform:none;letter-spacing:0}
label.campo input:focus,label.campo select:focus,label.campo textarea:focus{border-color:var(--turq-t);outline:none;box-shadow:0 0 0 3px rgba(46,211,183,.2)}
.clave{position:relative}
.clave .ojo{position:absolute;right:6px;bottom:6px;background:none;border:0;cursor:pointer;padding:7px 9px;border-radius:8px;opacity:.7}
.clave .ojo:hover{opacity:1;background:var(--hover)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 18px;font-weight:700;font-size:14.5px;cursor:pointer;
  background:var(--panel-2);color:var(--fuerte);border:1px solid var(--borde);transition:transform .15s,box-shadow .15s,background .15s;white-space:nowrap}
.btn:hover{background:#21395c}
.btn:disabled{opacity:.55;cursor:default}
.btn.pri{background:linear-gradient(90deg,var(--turq),var(--turq-soft));color:var(--tinta);border:0;box-shadow:0 8px 26px rgba(46,211,183,.28)}
.btn.pri:hover{transform:translateY(-1px);box-shadow:0 12px 32px rgba(46,211,183,.4)}
.btn.peligro{background:rgba(239,83,80,.14);border-color:rgba(239,83,80,.5);color:var(--rojo-t)}
.btn.mini{padding:7px 11px;font-size:12.5px;border-radius:9px}
.btn.ancho{width:100%;padding:14px;font-size:15.5px}
.error{color:var(--rojo-t);font-size:13.5px;min-height:20px;margin-top:10px}
.aviso{color:var(--ambar-t);font-size:13.5px}
.ayuda{text-align:center;color:var(--gris);font-size:13px;line-height:1.6}
.ayuda a{font-weight:600}
.pie-login{color:var(--gris-osc);font-size:12px;font-family:var(--mono);text-align:center}

/* ---------- barra superior ---------- */
header.barra{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:12px 20px;
  background:var(--vidrio);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--linea)}
header.barra .logo svg{height:30px;width:auto;display:block}
header.barra .esp{flex:1}
.quien{font-size:13px;color:var(--gris);text-align:right;line-height:1.3}
.quien b{color:var(--fuerte);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-family:var(--mono);font-weight:600;
  border:1px solid var(--borde);color:var(--gris);background:var(--hover);white-space:nowrap}
.chip.ok{color:var(--turq-t);border-color:rgba(46,211,183,.45);background:rgba(46,211,183,.08)}
.chip.mal{color:var(--rojo-t);border-color:rgba(239,83,80,.5);background:rgba(239,83,80,.1)}
.chip.aviso{color:var(--ambar-t);border-color:rgba(242,169,59,.5);background:rgba(242,169,59,.09)}
.chip.sup{color:var(--tinta);background:var(--ambar);border-color:var(--ambar-t)}

/* ---------- lanzador de herramientas ---------- */
#vApp{position:relative;z-index:1;min-height:100dvh}
.pagina{max-width:1040px;margin:0 auto;padding:34px 20px 60px}
.saludo{margin-bottom:28px}
.saludo .rot{font-family:var(--mono);font-size:12px;letter-spacing:.16em;color:var(--turq-t);text-transform:uppercase}
.saludo h2{font-size:clamp(26px,4.4vw,38px);font-weight:800;letter-spacing:-.02em;margin:8px 0 10px}
.saludo p{color:var(--gris);font-size:15px;max-width:42em}
.herr{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:22px}
.h-card{position:relative;overflow:hidden;text-align:left;border-radius:24px;padding:0;cursor:pointer;color:inherit;display:flex;flex-direction:column;min-height:340px;
  background:linear-gradient(165deg,var(--panel-2),var(--panel));border:1px solid var(--borde);
  transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s;
  animation:aparece .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 90ms)}
@keyframes aparece{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.h-card:hover{transform:translateY(-6px);border-color:var(--c);box-shadow:0 24px 60px var(--sombra),0 0 60px -12px color-mix(in srgb,var(--c) 50%,transparent)}
.h-card .arte{position:relative;height:172px;display:grid;place-items:center;overflow:hidden;border-bottom:1px solid var(--linea);
  background:radial-gradient(120% 140% at 80% 0%,color-mix(in srgb,var(--c) 30%,transparent),transparent 62%),linear-gradient(180deg,var(--sutil),transparent)}
.h-card .arte svg.escena{width:88%;height:88%;color:var(--c);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.h-card:hover .arte svg.escena{transform:scale(1.07) translateY(-3px)}
.h-card .cuerpo{padding:20px 24px 24px;display:flex;flex-direction:column;gap:10px;flex:1}
.h-card .cab-t{display:flex;align-items:center;gap:12px}
.h-card .ico{width:42px;height:42px;flex:none;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent);border:1px solid color-mix(in srgb,var(--c) 55%,transparent);color:var(--c)}
.h-card .ico svg{width:23px;height:23px}
.h-card h3{font-size:22px;font-weight:800;letter-spacing:-.01em}
.h-card p{color:var(--gris);font-size:14px;line-height:1.55}
.h-card .pie{margin-top:auto;padding-top:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.h-card .ir{display:inline-flex;align-items:center;gap:8px;background:var(--c);color:var(--tinta);padding:10px 18px;border-radius:12px;font-weight:800;font-size:14px;transition:gap .2s}
.h-card:hover .ir{gap:14px}
.h-card.off{cursor:default;opacity:.66}
.h-card.off:hover{transform:none;border-color:var(--borde);box-shadow:none}
.herr.uno .h-card{flex-direction:row;min-height:320px}
.herr.uno .h-card .arte{order:2;flex:1.15;height:auto;border-bottom:0;border-left:1px solid var(--linea)}
.herr.uno .h-card .cuerpo{flex:1;justify-content:center;padding:32px}
.herr.uno .h-card h3{font-size:32px}
@media (max-width:760px){
  .herr.uno .h-card{flex-direction:column}
  .herr.uno .h-card .arte{order:0;height:172px;flex:none;border-left:0;border-bottom:1px solid var(--linea)}
  .herr.uno .h-card .cuerpo{padding:20px 24px 24px}
  .herr.uno .h-card h3{font-size:24px}
}
/* escenas animadas de las tarjetas */
.ar-pulso{animation:arPulso 1.3s ease-in-out infinite}
@keyframes arPulso{50%{opacity:.2}}
.ar-cam{stroke-opacity:.3;animation:arCam 6s ease-in-out infinite}
@keyframes arCam{0%,28%{stroke-opacity:1}34%,100%{stroke-opacity:.3}}
.ar-bar{transform-box:fill-box;transform-origin:bottom;animation:arBar 3.4s ease-in-out infinite}
@keyframes arBar{0%,100%{transform:scaleY(.5)}50%{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.h-card,.ar-pulso,.ar-cam,.ar-bar{animation:none}.ar-cam{opacity:1}}
.vacio{border:1px dashed var(--borde);border-radius:18px;padding:34px;text-align:center;color:var(--gris);line-height:1.7}
.banda-como{position:sticky;top:0;z-index:30;background:var(--ambar);color:var(--tinta);font-weight:700;font-size:14px;padding:9px 16px;text-align:center}

/* ---------- administración ---------- */
.shell{display:grid;grid-template-columns:230px 1fr;min-height:calc(100dvh - 55px)}
nav.lateral{border-right:1px solid var(--linea);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:55px;height:calc(100dvh - 55px);overflow:auto}
nav.lateral .sec{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--gris-osc);padding:14px 12px 6px;text-transform:uppercase}
nav.lateral button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;padding:11px 12px;border-radius:11px;color:var(--gris);font-weight:600;font-size:14.5px;cursor:pointer}
nav.lateral button svg{width:20px;height:20px;flex:none}
nav.lateral button:hover{background:var(--hover);color:var(--fuerte)}
nav.lateral button.activo{background:rgba(46,211,183,.12);color:var(--turq-t)}
nav.lateral .num{margin-left:auto;background:var(--ambar);color:var(--tinta);border-radius:999px;font-size:11px;font-weight:800;padding:1px 8px;font-family:var(--mono)}
main.contenido{padding:28px 28px 70px;min-width:0}
.titulo-vista{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.titulo-vista h2{font-size:26px;font-weight:800;letter-spacing:-.015em}
.titulo-vista p{color:var(--gris);font-size:14px;margin-top:4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px}
.kpi{background:linear-gradient(160deg,var(--panel-2),var(--panel));border:1px solid var(--borde);border-radius:16px;padding:18px}
.kpi .n{font-family:var(--mono);font-size:34px;font-weight:600;color:var(--turq-t);line-height:1}
.kpi.aviso .n{color:var(--ambar-t)} .kpi.mal .n{color:#FF8A80}
.kpi .t{color:var(--gris);font-size:13px;margin-top:8px}
.cuadros{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.caja{background:var(--panel);border:1px solid var(--borde);border-radius:16px;padding:18px;min-width:0}
.caja h3{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.fila{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed var(--borde);font-size:14px}
.fila:last-child{border-bottom:0}
.fila .sub{color:var(--gris);font-size:12.5px}
.vacio-mini{color:var(--gris-osc);font-size:13.5px;padding:8px 0}
.tabla-wrap{overflow:auto;border:1px solid var(--borde);border-radius:16px;background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
th{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gris);text-align:left;padding:12px 14px;border-bottom:1px solid var(--borde);background:var(--sutil);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid rgba(36,59,88,.6);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.clic{cursor:pointer} tr.clic:hover td{background:var(--hover)}
.herram-chips{display:flex;gap:6px;flex-wrap:wrap}
.barra-filtros{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.barra-filtros input{flex:1;min-width:200px;padding:11px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--borde);color:var(--fuerte)}
.grafico{display:flex;align-items:flex-end;gap:3px;height:120px;padding-top:6px}
.grafico .b{flex:1;background:linear-gradient(180deg,var(--turq),var(--turq-osc));border-radius:4px 4px 0 0;min-height:2px;position:relative}
.grafico .b.cero{background:var(--borde);min-height:2px;opacity:.6}
.eje{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--gris-osc);margin-top:6px}

/* ---------- panel lateral (organización) y ventanas ---------- */
.cortina{position:fixed;inset:0;background:var(--velo);z-index:60;backdrop-filter:blur(3px)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--tinta-2);border-left:1px solid var(--borde);z-index:61;overflow:auto;padding:0 0 40px;animation:entra .22s ease-out}
@keyframes entra{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.drawer .cab{position:sticky;top:0;z-index:2;background:var(--tinta-2);padding:18px 22px;border-bottom:1px solid var(--borde);display:flex;justify-content:space-between;align-items:center;gap:10px}
.drawer .cab h3{font-size:19px;font-weight:800}
.drawer .cuerpo{padding:20px 22px;display:flex;flex-direction:column;gap:18px}
.bloque{background:var(--panel);border:1px solid var(--borde);border-radius:14px;padding:16px}
.bloque>h4{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gris);margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lic{border:1px solid var(--borde);border-radius:12px;padding:14px;margin-bottom:12px;background:var(--sutil)}
.lic.on{border-color:rgba(46,211,183,.4)}
.lic .cabl{display:flex;align-items:center;gap:10px;font-weight:700;margin-bottom:10px}
.lic .opc{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.lic .acc{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.marca-chk{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.marca-chk input{width:18px;height:18px;accent-color:var(--turq-t)}
.usr{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 0;border-bottom:1px dashed var(--borde)}
.usr:last-child{border-bottom:0}
.usr .dat{flex:1;min-width:150px}
.usr .dat b{font-size:14.5px}
.usr .dat .sub{color:var(--gris);font-size:12.5px}
.logos-g{display:flex;gap:12px;flex-wrap:wrap}
.logo-it{position:relative;width:104px;height:84px;border-radius:12px;background:repeating-conic-gradient(#1b2e49 0% 25%,#142540 0% 50%) 50%/16px 16px;border:1px solid var(--borde);display:grid;place-items:center}
.logo-it img{max-width:90%;max-height:90%;object-fit:contain}
.logo-it button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:#000b;color:#fff;cursor:pointer;font-size:11px}
.modal{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:16px}
.modal .caja-m{position:relative;z-index:71;width:min(470px,100%);max-height:92dvh;overflow:auto;background:var(--panel);border:1px solid var(--borde);border-radius:18px;padding:24px;box-shadow:0 30px 80px var(--sombra)}
.modal h3{font-size:19px;font-weight:800;margin-bottom:6px}
.modal .txt{color:var(--gris);font-size:14px;margin-bottom:16px;line-height:1.55}
.modal .botones{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.datos-envio{background:var(--tinta-2);border:1px dashed var(--turq-osc);border-radius:12px;padding:14px;font-family:var(--mono);font-size:13.5px;line-height:1.8;white-space:pre-wrap;word-break:break-all;color:var(--fuerte)}

  const h = Object.assign({'apikey': SB_KEY, 'Content-Type': 'application/json'}, opts.headers || {});
  if (conSesion && ses){ await asegurarToken(); if (ses) h['Authorization'] = 'Bearer ' + ses.access_token; }
  const r = await fetch(SB_URL + path, Object.assign({}, opts, {headers: h}));
  const txt = await r.text();
  let data = null; try{ data = txt ? JSON.parse(txt) : null; }catch(e){ data = txt; }
  if (!r.ok){
    const msg = (data && (data.message || data.msg || data.error_description || data.error)) || ('Error ' + r.status);
    const err = new Error(msg); err.status = r.status; throw err;
  }
  return data;
}
const rpc = (fn, args, conSesion = true) => sb('/rest/v1/rpc/' + fn, {method:'POST', body: JSON.stringify(args || {})}, conSesion);
let refrescando = null;
async function asegurarToken(){
  if (!ses || ses.expires_at - Date.now()/1000 > 90) return;
  if (!refrescando) refrescando = (async () => {
    try{
      const d = await sb('/auth/v1/token?grant_type=refresh_token', {method:'POST', body: JSON.stringify({refresh_token: ses.refresh_token})}, false);
      guardarSesion({access_token: d.access_token, refresh_token: d.refresh_token, expires_at: Date.now()/1000 + d.expires_in});
    }catch(e){ if (e.status && e.status >= 400 && e.status < 500) guardarSesion(null); }
    finally{ refrescando = null; }
  })();
  await refrescando;
}
async function llamarFuncion(cuerpo){
  await asegurarToken();
  if (!ses) throw new Error('Tu sesión venció. Vuelve a ingresar.');
  const r = await fetch(SB_URL + '/functions/v1/yv-usuarios', {
    method: 'POST', headers: {'apikey': SB_KEY, 'Authorization': 'Bearer ' + ses.access_token, 'Content-Type': 'application/json'},
    body: JSON.stringify(cuerpo)
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok || d.error) throw new Error(d.error || ('Error ' + r.status));
  return d;
}

function toast(msg, mal){ const t = $('#toast'); t.textContent = msg; t.className = 'ver' + (mal ? ' mal' : ''); clearTimeout(toast.t); toast.t = setTimeout(() => t.className = '', mal ? 4800 : 2600); }
function fechaBonita(iso){ if (!iso) return ''; const [y, m, d] = String(iso).slice(0, 10).split('-'); return `${d}/${m}/${y}`; }
function sumarDias(iso, n){ const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }
function dispositivoActual(){
  const ua = navigator.userAgent || '';
  const movil = /Android|iPhone|iPad|iPod|Mobile/i.test(ua) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(ua));
  return movil ? 'celular' : 'computadora';
}

function generarClave(){
  const abc = 'abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const b = new Uint32Array(10); crypto.getRandomValues(b);
  return Array.from(b, n => abc[n % abc.length]).join('');
}
function slug(t){ return String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '.').replace(/^\.+|\.+$/g, '').slice(0, 24); }
async function copiar(texto){
  try{ await navigator.clipboard.writeText(texto); toast('Copiado'); }
  catch(e){ const a = document.createElement('textarea'); a.value = texto; document.body.appendChild(a); a.select(); try{ document.execCommand('copy'); toast('Copiado'); }catch(_){ toast('No se pudo copiar', true); } a.remove(); }
}

function modal({titulo, html, botones, onAbrir, hoja}){
  const m = document.createElement('div'); m.className = 'modal' + (hoja ? ' hoja' : '');
  m.innerHTML = `<div class="cortina"></div><div class="caja-m" role="dialog" aria-modal="true"><h3>${esc(titulo)}</h3>${html || ''}<div class="botones"></div></div>`;
  const cont = m.querySelector('.botones');
  const cerrar = () => m.remove();
  (botones || [{txt: 'Cerrar'}]).forEach(b => {
    const x = document.createElement('button'); x.className = 'btn ' + (b.cls || ''); x.textContent = b.txt;
    x.onclick = async () => {
      if (!b.fn){ cerrar(); return; }
      x.disabled = true;
      try{ const r = await b.fn(m); if (r !== false) cerrar(); }
      catch(e){ toast(e.message || 'Error', true); }
      finally{ x.disabled = false; }
    };
    cont.appendChild(x);
  });
  m.querySelector('.cortina').onclick = cerrar;
  $('#capas').appendChild(m);
  if (onAbrir) onAbrir(m);
  const p = m.querySelector('input,select,textarea'); if (p) p.focus();
  return m;
}

/* ---------- vista del cliente ---------- */
function estadoHerramienta(h, esAdmin){
  const l = h.licencia;
  const disp = dispositivoActual();
  if (!l) return {ok: esAdmin, chip: '<span class="chip">Sin licencia</span>', motivo: ''};
  if (!l.activa) return {ok: false, chip: '<span class="chip mal">Inactiva</span>', motivo: 'Esta herramienta está inactiva. Escribe a Yupasoft.'};
  if (!l.vigente) return {ok: false, chip: `<span class="chip mal">Vencida${l.vence_el ? ' el ' + fechaBonita(l.vence_el) : ''}</span>`, motivo: 'Tu licencia venció. Escribe a Yupasoft para renovarla.'};
  const chip = `<span class="chip ok">${l.vence_el ? 'Vigente · hasta ' + fechaBonita(l.vence_el) : 'Vigente · sin vencimiento'}</span>`;
  if (l.dispositivos !== 'todos' && l.dispositivos !== disp && !esAdmin)
    return {ok: false, chip, motivo: l.dispositivos === 'computadora' ? 'Disponible solo en computadora. Ábrela desde tu laptop o PC.' : 'Disponible solo en celular. Ábrela desde tu teléfono.'};
  return {ok: true, chip, motivo: ''};
}
function urlHerramienta(h){
  const u = new URL(h.url, location.href);
  if (P && P.como && P.empresa) u.searchParams.set('como', P.empresa.id);
  return u.href;
}
function entrarCliente(){
  const hs = P.herramientas || [];
  const volver = params.get('volver');
  if (params.get('cuenta')){ vistaCli = 'cuenta'; pintarCliente(); return; }
  const usables = hs.filter(h => estadoHerramienta(h, false).ok);
  if (!params.get('menu')){
    if (volver){ const h = usables.find(x => x.id === volver); if (h){ location.replace(urlHerramienta(h)); return; } }
    if (hs.length === 1 && usables.length === 1){ location.replace(urlHerramienta(usables[0])); return; }
  }
  pintarCliente();
}
let vistaCli = 'herr';
function pintarCliente(){
  document.querySelectorAll('#navCli button').forEach(b => b.classList.toggle('activo', b.dataset.v === vistaCli));
  if (vistaCli === 'cuenta'){ pintarCuentaCliente(); return; }

function pintarLanzador(hs, esAdmin){
  const nombre = P.nombre || P.usuario || '';
  const org = P.empresa ? P.empresa.nombre : '';
  let tarjetas = hs.map((h, i) => {
    const e = estadoHerramienta(h, esAdmin);
    const prueba = h.estado === 'pruebas' ? '<span class="chip aviso">En pruebas</span>' : '';
    const disp = h.licencia && h.licencia.dispositivos !== 'todos' ? `<span class="chip">${NOMBRE_DISP[h.licencia.dispositivos]}</span>` : '';
    return tarjetaHerramienta(h, i, {activa: e.ok, chips: e.chip + prueba + disp, nota: e.motivo, accion: e.ok ? `data-a="abrir" data-id="${esc(h.id)}"` : 'disabled'});
  }).join('');
  if (!hs.length) tarjetas = `<div class="vacio" style="grid-column:1/-1">Aún no tienes herramientas activas en tu cuenta.<br><a href="${WHATSAPP}" target="_blank" rel="noopener">Escribe a Yupasoft</a> y las activamos.</div>`;
  const cont = `<div class="pagina">
    <div class="saludo"><div class="rot">${org ? esc(org) : 'Portal Yupasoft'}</div>
      <h2>${nombre ? 'Hola, ' + esc(nombre) : 'Bienvenido'}</h2>
      <p>${esAdmin ? 'Estas son todas tus herramientas. Ábrelas con tu propia cuenta para probarlas antes de lanzarlas.' : 'Elige la herramienta con la que quieres trabajar.'}</p></div>
    <div class="herr ${hs.length === 1 ? 'uno' : ''}">${tarjetas}</div>
    ${esAdmin ? '' : `<p class="ayuda" style="margin-top:30px">¿Necesitas ayuda? <a href="${WHATSAPP}" target="_blank" rel="noopener">Escríbenos por WhatsApp</a></p>`}
  </div>`;
  return cont;
}

/* --- Panel --- */
function chipLic(l){
  const h = (A.herramientas.find(x => x.id === l.herramienta_id) || {nombre: l.herramienta_id}).nombre;
  if (!l.activa) return `<span class="chip mal">${esc(h)} · inactiva</span>`;
  if (!l.vigente) return `<span class="chip mal">${esc(h)} · vencida</span>`;
  const prox = l.vence_el && l.vence_el <= sumarDias(A.hoy, 30);
  return `<span class="chip ${prox ? 'aviso' : 'ok'}">${esc(h)} · ${l.vence_el ? fechaBonita(l.vence_el) : 'sin venc.'}</span>`;
}
function vPanel(){
  const orgs = A.organizaciones, hoy = A.hoy, lim = sumarDias(hoy, 30);
  const lics = orgs.flatMap(o => o.licencias.map(l => Object.assign({org: o}, l)));
  const vigentes = lics.filter(l => l.vigente).length;
  const porVencer = lics.filter(l => l.vigente && l.vence_el && l.vence_el <= lim).sort((a, b) => a.vence_el.localeCompare(b.vence_el));
  const vencidas = lics.filter(l => l.activa && !l.vigente && l.vence_el && l.vence_el < hoy);
  const usuarios = A.usuarios.filter(u => !u.es_super).length;
  const nuevas = (A.solicitudes || []).filter(s => (s.estado || 'Nuevo') === 'Nuevo');
  const usos30 = (A.uso_dia || []).reduce((s, x) => s + Number(x.total), 0);
  // gráfico de los últimos 30 días
  const porDia = {}; (A.uso_dia || []).forEach(x => { porDia[x.dia] = (porDia[x.dia] || 0) + Number(x.total); });
  const dias = []; for (let i = 29; i >= 0; i--) dias.push(sumarDias(hoy, -i));
  const max = Math.max(1, ...dias.map(d => porDia[d] || 0));
  const barras = dias.map(d => { const v = porDia[d] || 0; return `<div class="b ${v ? '' : 'cero'}" style="height:${v ? Math.max(6, v / max * 100) : 2}%" title="${fechaBonita(d)}: ${v}"></div>`; }).join('');
  const fila = (l, tipo) => `<div class="fila"><div><b>${esc(l.org.nombre)}</b><div class="sub">${esc((A.herramientas.find(h => h.id === l.herramienta_id) || {}).nombre || l.herramienta_id)} · ${tipo === 'v' ? 'venció el ' : 'vence el '}${fechaBonita(l.vence_el)}</div></div><div style="display:flex;gap:6px"><button class="btn mini pri" data-a="renovar" data-e="${l.org.id}" data-h="${l.herramienta_id}">Renovar</button><button class="btn mini" data-a="org" data-id="${l.org.id}">Abrir</button></div></div>`;
  return `<div class="titulo-vista"><div><h2>Panel</h2><p>Así está tu negocio hoy, ${fechaBonita(hoy)}.</p></div>
      <button class="btn pri" data-a="nuevaOrg">+ Nueva organización o persona</button></div>
    <div class="kpis">
      <div class="kpi" data-a="vista" data-v="orgs"><div class="n">${orgs.filter(o => o.activa).length}</div><div class="t">Organizaciones y personas activas</div></div>
      <div class="kpi" data-a="vista" data-v="usuarios"><div class="n">${usuarios}</div><div class="t">Usuarios de clientes</div></div>
      <div class="kpi"><div class="n">${vigentes}</div><div class="t">Licencias vigentes</div></div>
      <div class="kpi ${porVencer.length ? 'aviso' : ''}"><div class="n">${porVencer.length}</div><div class="t">Vencen en 30 días</div></div>
      <div class="kpi ${vencidas.length ? 'mal' : ''}"><div class="n">${vencidas.length}</div><div class="t">Vencidas</div></div>
      <div class="kpi ${nuevas.length ? 'aviso' : ''}" data-a="vista" data-v="solicitudes"><div class="n">${nuevas.length}</div><div class="t">Solicitudes nuevas</div></div>
    </div>
    <div class="cuadros">
      <div class="caja"><h3>Licencias por vencer o vencidas</h3>
        ${porVencer.map(l => fila(l, 'p')).join('') + vencidas.map(l => fila(l, 'v')).join('') || '<div class="vacio-mini">Nada por vencer en los próximos 30 días.</div>'}</div>
      <div class="caja"><h3>Solicitudes nuevas <button class="btn mini" data-a="vista" data-v="solicitudes">Ver todas</button></h3>
        ${nuevas.slice(0, 5).map(s => `<div class="fila"><div><b>${esc(s.nombre || 'Sin nombre')}</b><div class="sub">${esc(s.solucion || '')} · ${fechaBonita(s.creado_en)}</div></div></div>`).join('') || '<div class="vacio-mini">No hay solicitudes nuevas.</div>'}</div>
      <div class="caja" style="grid-column:1/-1"><h3>Uso de los últimos 30 días <span class="chip">${usos30} sesiones de trabajo</span></h3>
        <div class="grafico">${barras}</div><div class="eje"><span>${fechaBonita(dias[0])}</span><span>${fechaBonita(dias[29])}</span></div></div>
      <div class="caja" style="grid-column:1/-1"><h3>Actividad reciente</h3>
        ${(A.uso_reciente || []).map(u => `<div class="fila"><div><b>${esc(u.empresa || '—')}</b><div class="sub">${u.evento === 'sala_prueba_admin' ? 'Prueba tuya' : 'Abrió una sala de transmisión'} · ${esc(u.herramienta_id || '')}</div></div><span class="sub mono">${new Date(u.cuando).toLocaleString('es-PE', {timeZone: 'America/Lima', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'})}</span></div>`).join('') || '<div class="vacio-mini">Todavía no hay uso registrado. Se empieza a registrar desde ahora.</div>'}</div>
    </div>`;
}

function subirLogo(input){
  const f = input.files[0]; input.value = ''; const o = orgActual(); if (!f || !o) return;
  const lector = new FileReader();
  lector.onload = () => {
    const im = new Image();
    im.onload = async () => {
      const esc2 = Math.min(1, 1000 / Math.max(im.naturalWidth, im.naturalHeight));
      const cv = document.createElement('canvas'); cv.width = Math.round(im.naturalWidth * esc2); cv.height = Math.round(im.naturalHeight * esc2);
      cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
      const data = cv.toDataURL('image/png');
      if (data.length > 1400000){ toast('La imagen es muy pesada. Usa una más pequeña.', true); return; }
      try{ await rpc('yv_admin_agregar_logo', {p_empresa: o.id, p_nombre: f.name.replace(/\.[^.]+$/, '').slice(0, 60), p_imagen: data}); await refrescar(); toast('Logo agregado'); }
      catch(e){ toast('No se pudo guardar el logo: ' + e.message, true); }
    };
    im.onerror = () => toast('No pude leer esa imagen.', true);
    im.src = lector.result;
  };
  lector.readAsDataURL(f);
}

      nombre: 'Historial', titulo: 'Historial de transmisiones · ' + (CU.empresa ? CU.empresa.nombre : ''),
      columnas: [{clave: 'f', titulo: 'Cuándo', tipo: 'fechahora'}, {clave: 'u', titulo: 'Usuario'}, {clave: 'h', titulo: 'Herramienta'}, {clave: 'e', titulo: 'Qué pasó'}],
      filas: CU.historial.map(h => ({f: h.cuando, u: h.usuario, h: nomHerr(h.herramienta_id), e: NOMBRE_EVENTO[h.evento] || h.evento}))}]})); },
  xlsTodo(d, btn){ conEspera(btn, async () => { const ex = await rpc('yp_exportar', {}); await YupaExcel.descargar({archivo: 'Yupasoft_mis-datos_' + ex.organizacion.nombre + '_' + hoyArchivo(), hojas: hojasExportacion(ex, false)}); }); },
  xlsOrg(d, btn){ const o = orgActual(); conEspera(btn, async () => { const ex = await rpc('yp_exportar', {p_empresa: o.id}); await YupaExcel.descargar({archivo: 'Yupasoft_datos_' + o.nombre + '_' + hoyArchivo(), hojas: hojasExportacion(ex, true)}); await cargarPanel(); }); },
  xlsVista(d, btn){ conEspera(btn, () => YupaExcel.descargar(exportarVista(d.v))); }
});
function exportarVista(v){
  const f = hoyArchivo();
  if (v === 'orgs') return {archivo: 'Yupasoft_organizaciones_' + f, hojas: [{nombre: 'Organizaciones', titulo: 'Organizaciones y personas',
    columnas: [{clave: 'n', titulo: 'Nombre'}, {clave: 't', titulo: 'Tipo'}, {clave: 'c', titulo: 'Contacto'}, {clave: 'a', titulo: 'Cuenta'}, {clave: 'l', titulo: 'Licencias', ancho: 50}, {clave: 'u', titulo: 'Usuarios', tipo: 'entero'}, {clave: 'cr', titulo: 'Creada el', tipo: 'fecha'}, {clave: 'no', titulo: 'Notas internas', ancho: 36}],
    filas: A.organizaciones.map(o => ({n: o.nombre, t: o.tipo === 'individual' ? 'Persona' : 'Organización', c: o.contacto, a: o.activa ? 'Activa' : 'Desactivada',
      l: o.licencias.map(l => nomHerr(l.herramienta_id) + ': ' + estadoTexto(l) + (l.vence_el ? ' hasta ' + fechaBonita(l.vence_el) : ' (sin vencimiento)') + ' · ' + NOMBRE_DISP[l.dispositivos]).join(' | '),
      u: nUsuarios(o), cr: o.creado_el, no: o.notas}))}]};
  if (v === 'usuarios') return {archivo: 'Yupasoft_usuarios_' + f, hojas: [{nombre: 'Usuarios', titulo: 'Usuarios',
    columnas: [{clave: 'u', titulo: 'Usuario'}, {clave: 'n', titulo: 'Nombre'}, {clave: 'c', titulo: 'Contacto'}, {clave: 'o', titulo: 'Organización'}, {clave: 'r', titulo: 'Rol'}, {clave: 'b', titulo: 'Estado'}, {clave: 'ui', titulo: 'Último ingreso', tipo: 'fechahora'}, {clave: 'cr', titulo: 'Creado el', tipo: 'fecha'}],
    filas: A.usuarios.map(u => { const o = A.organizaciones.find(x => x.id === u.empresa_id); return {u: u.usuario || u.email, n: u.nombre, c: u.contacto, o: o ? o.nombre : 'Sin organización', r: u.es_super ? 'Administrador' : (NOMBRE_ROL[u.rol] || ''), b: u.bloqueado ? 'Bloqueado' : 'Activo', ui: u.ultimo_ingreso, cr: u.creado}; })}]};
  if (v === 'solicitudes') {
    const campos = [['creado_en', 'Fecha', 'fecha'], ['nombre', 'Nombre'], ['solucion', 'Solución'], ['estado', 'Estado'], ['negocio', 'Negocio'], ['organizacion', 'Organización'], ['necesidad', 'Necesidad'], ['productos', 'Productos'], ['locales', 'Locales'], ['usuarios', 'Usuarios'], ['codigo', 'Código de barras'], ['variantes', 'Variantes'], ['lotes', 'Lotes'], ['factura', 'Factura hoy con'], ['frecuencia', 'Frecuencia'], ['formato', 'Formato'], ['fecha_evento', 'Fecha del evento'], ['mensaje', 'Mensaje']];
    return {archivo: 'Yupasoft_solicitudes_' + f, hojas: [{nombre: 'Solicitudes', titulo: 'Solicitudes de la página', columnas: campos.map(([k, t, tp]) => ({clave: k, titulo: t, tipo: tp || 'texto'})), filas: A.solicitudes}]};
  }
  return {archivo: 'Yupasoft_actividad_' + f, hojas: [{nombre: 'Actividad', titulo: 'Actividad del administrador',
    columnas: [{clave: 'c', titulo: 'Cuándo', tipo: 'fechahora'}, {clave: 'q', titulo: 'Quién'}, {clave: 'a', titulo: 'Qué'}, {clave: 'o', titulo: 'Organización'}, {clave: 'd', titulo: 'Detalle', ancho: 60}],
    filas: (A.auditoria || []).map(a => ({c: a.cuando, q: a.quien_nombre, a: NOMBRES_ACCION[a.accion] || a.accion, o: a.empresa, d: a.detalle ? Object.entries(a.detalle).map(([k, x]) => k + ': ' + x).join(' · ') : ''}))}]};
}


/* ---------- Celular: renovar, contacto, "Más" y actualizar ---------- */
function sumarMeses(iso, n){
  const [y, m, d] = iso.split('-').map(Number);
  const t = new Date(Date.UTC(y, m - 1 + n, 1)); const ult = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth() + 1, 0)).getUTCDate();
  t.setUTCDate(Math.min(d, ult)); return t.toISOString().slice(0, 10);
}
function telDe(c){
  const t = String(c || '').trim(); if (!t || t.includes('@')) return null;
  const d = t.replace(/\D/g, ''); if (d.length === 9) return '51' + d; if (d.length === 11 && d.startsWith('51')) return d; return null;
}
function contactoAcciones(c){
  const tel = telDe(c), mail = c && String(c).includes('@') ? String(c).trim() : null;
  if (!tel && !mail) return '';
  return `<div class="contacto-ac">${tel ? `<a href="tel:+${tel}">📞 Llamar</a><a href="https://wa.me/${tel}" target="_blank" rel="noopener">💬 WhatsApp</a>` : ''}${mail ? `<a href="mailto:${esc(mail)}">✉ Correo</a>` : ''}</div>`;
}
Object.assign(acciones, {
  refrescarTodo(d, btn){ conEspera(btn, async () => { await cargarPanel(); pintarShell(); if (orgAbierta) cargarLogosOrg(orgAbierta); }, 'Datos actualizados'); },
  mas(){
    const items = [['herramientas', 'Herramientas', 'tool'], ['actividad', 'Actividad', 'act'], ['mis', 'Abrir mis apps', 'apps']];
    modal({titulo: 'Más', hoja: true, html: `<div class="lista-mas">${items.map(([id, t, ic]) => `<button data-a="masIr" data-v="${id}">${icono(ic)}${t}</button>`).join('')}
      <button data-a="refrescarTodo">${icono('act')}Actualizar datos</button></div>`, botones: [{txt: 'Cerrar'}]});
  },
  masIr(d){ const m = document.querySelectorAll('#capas .modal'); if (m.length) m[m.length - 1].remove(); vista = d.v; pintarShell(); },
  renovar(d){
    const o = A.organizaciones.find(x => x.id === d.e); const l = o.licencias.find(x => x.herramienta_id === d.h);
    const hoy = A.hoy; const base = l.vence_el && l.vence_el > hoy ? l.vence_el : hoy; let nuevo = null;
    const nom = nomHerr(d.h);
    const m = modal({titulo: 'Renovar ' + nom, html: `<p class="txt"><b>${esc(o.nombre)}</b><br>${l.vence_el ? (l.vence_el < hoy ? 'Venció el ' : 'Vence el ') + fechaBonita(l.vence_el) : 'Hoy no tiene vencimiento'}. ${l.vence_el && l.vence_el >= hoy ? 'Se suma desde esa fecha.' : 'Se cuenta desde hoy.'}</p>
        <div class="opciones-renov">${[[1, '+1 mes'], [3, '+3 meses'], [6, '+6 meses'], [12, '+1 año']].map(([n, t]) => `<button data-n="${n}">${t}</button>`).join('')}
          <button data-n="sin">Sin vencimiento</button><button data-n="fecha">Elegir fecha</button></div>
        <label class="campo" id="rFechaBox" hidden>Nueva fecha <input type="date" id="rFecha"></label>
        <div class="renov-res" id="rRes">Elige una opción.</div>`,
      botones: [{txt: 'Cancelar'}, {txt: 'Renovar', cls: 'pri', fn: async () => {
        if (nuevo === null) throw new Error('Elige una opción de renovación');
        await rpc('yp_admin_licencia', {p_empresa: o.id, p_herramienta: d.h, p_activa: true, p_vence: nuevo === 'sin' ? null : nuevo, p_dispositivos: l.dispositivos});
        await cargarPanel(); pintarShell(); if (orgAbierta) cargarLogosOrg(orgAbierta); toast('Licencia renovada');
      }}]});
    const pinta = () => { $('#rRes', m).innerHTML = nuevo === null ? 'Elige una opción.' : (nuevo === 'sin' ? 'Quedará <b>sin vencimiento</b>.' : 'Nuevo vencimiento: <b>' + fechaBonita(nuevo) + '</b>'); };
    m.querySelectorAll('.opciones-renov button').forEach(b => b.onclick = () => {
      m.querySelectorAll('.opciones-renov button').forEach(x => x.classList.toggle('sel', x === b));
      const v = b.dataset.n; $('#rFechaBox', m).hidden = v !== 'fecha';
      if (v === 'sin') nuevo = 'sin'; else if (v === 'fecha'){ nuevo = $('#rFecha', m).value || null; } else nuevo = sumarMeses(base, Number(v));
      pinta();
    });
    $('#rFecha', m).addEventListener('change', e => { nuevo = e.target.value || null; pinta(); });
  }
});
// Al volver a la app después de un rato, el administrador ve datos frescos
let ultimoVistazo = Date.now();
document.addEventListener('visibilitychange', async () => {
  if (document.hidden){ ultimoVistazo = Date.now(); return; }
  if (A && P && P.es_super && Date.now() - ultimoVistazo > 120000 && !document.querySelector('#capas .modal')){
    try{ await cargarPanel(); pintarShell(); if (orgAbierta) cargarLogosOrg(orgAbierta); }catch(e){}
  }
});


/* ---------- Tema claro / oscuro (se recuerda en este equipo y lo comparte Yupavideo) ---------- */
const temaActual = () => document.documentElement.getAttribute('data-tema') === 'claro' ? 'claro' : 'oscuro';
function pintarBotonTema(){
  const claro = temaActual() === 'claro';
  document.querySelectorAll('[data-a="tema"]').forEach(b => { b.innerHTML = claro ? ICONOS.luna : ICONOS.sol; b.title = claro ? 'Cambiar a tema oscuro' : 'Cambiar a tema claro'; b.setAttribute('aria-label', b.title); });
  const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = claro ? '#F4F7FA' : '#0C1A2E';
}
Object.assign(acciones, {
  tema(){
    const nuevo = temaActual() === 'claro' ? 'oscuro' : 'claro';
    if (nuevo === 'claro') document.documentElement.setAttribute('data-tema', 'claro'); else document.documentElement.removeAttribute('data-tema');
    grabarLS('yp_tema', nuevo); pintarBotonTema();
  }
});
pintarBotonTema();

/* ---------- arranque ---------- */
window.addEventListener('hashchange', () => { if (A && P && P.es_super){ const h = location.hash.replace('#', ''); if (VISTAS.some(v => v[0] === h) && h !== vista){ vista = h; pintarShell(); } } });
iniciar();
